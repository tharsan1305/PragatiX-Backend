name: PragatiX Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Spring Boot Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Display environment information
      - name: Show Java and Maven Versions
        run: |
          java -version
          mvn -version

      # Validate project structure
      - name: Validate Maven Project
        run: |
          test -f pom.xml

      # Download dependencies
      - name: Download Maven Dependencies
        run: mvn dependency:resolve

      # Compile project
      - name: Compile Project
        run: mvn clean compile -B

      # Run Unit Tests
      - name: Run Unit Tests
        run: mvn test -B

      # Package Spring Boot Application
      - name: Package Application
        run: mvn package -DskipTests -B

      # Upload JUnit reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

      # Upload generated JAR
      - name: Upload Spring Boot JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar
          retention-days: 14
          if-no-files-found: error

      # GitHub Step Summary
      - name: Build Summary
        if: always()
        run: |
          echo "# PragatiX Backend CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered By: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend CI completed."
